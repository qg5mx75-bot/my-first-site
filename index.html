<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الأول</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #f8fafc;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px 32px;
      border-radius: 20px;
      max-width: 480px;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { margin: 0; line-height: 1.8; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>أهلاً بك 👋</h1>
    <p>هذا أول موقع لي، منشور مجاناً على GitHub Pages.</p>
  </div>
</body>
</html>
